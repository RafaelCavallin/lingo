name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run test:coverage

  # Deploy na Vercel só depois de lint, build e testes passarem.
  # A branch `prod` vira produção; qualquer outra vira preview.
  # Os deploys automáticos da integração Git estão desligados em vercel.json.
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-${{ github.ref }}
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DEPLOY_ENV: ${{ github.ref_name == 'prod' && 'production' || 'preview' }}
      VERCEL_CLI_VERSION: 65.7.0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm install --global vercel@${VERCEL_CLI_VERSION}

      - name: Baixa variáveis e configurações do ambiente
        run: vercel pull --yes --environment="$DEPLOY_ENV" --git-branch="$GITHUB_REF_NAME"

      - name: Build
        run: vercel build --environment="$DEPLOY_ENV"

      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt --environment="$DEPLOY_ENV")
          echo "Deploy ($DEPLOY_ENV): $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        id: deploy

      # Deploy feito pela CLI não ganha o endereço fixo da branch
      # (lingo-git-<branch>-…), então ele é apontado aqui.
      # Usa a API em vez de `vercel alias set`: a CLI ignora o VERCEL_ORG_ID
      # nesse comando, procura uma conta pessoal pelo token e falha com
      # "User not found". Se falhar, o job falha: o preview ficaria velho.
      - name: Aponta o endereço da branch para o deploy novo
        if: env.DEPLOY_ENV == 'preview'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TEAM_SLUG: rafaelcavallin89-3287s-projects
        run: |
          branch=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          alias="lingo-git-${branch}-${VERCEL_TEAM_SLUG}.vercel.app"
          api="https://api.vercel.com"
          auth="Authorization: Bearer $VERCEL_TOKEN"
          deployment_id=$(curl -fsS -H "$auth" "$api/v13/deployments/${DEPLOY_URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          if ! curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
              -d "{\"alias\":\"$alias\"}" \
              "$api/v2/deployments/$deployment_id/aliases?teamId=$VERCEL_ORG_ID" > /dev/null; then
            echo "::error::Não foi possível apontar $alias para o deploy novo."
            exit 1
          fi
          echo "Endereço da branch: https://$alias" >> "$GITHUB_STEP_SUMMARY"
